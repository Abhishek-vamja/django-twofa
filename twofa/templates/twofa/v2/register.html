{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

    <div class="background-circle circle-top"></div>
    <div class="background-circle circle-bottom"></div>
    <div class="login-container">
        <h2>Register</h2>
        <p>Alredy have a Mailchimp account? <a href="#">Login</a></p>
        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Create</button>
        </form>
        <div class="links">
            <a href="{% url 'twofa:forgot-username' %}"><i class="fas fa-info-circle"></i>Forgot username?</a>
            <a href="{% url 'twofa:forgot-password' %}"><i class="fas fa-info-circle"></i>Forgot password?</a>
            <a href="#"><i class="fas fa-info-circle"></i>Can't log in?</a>
        </div>
    </div>
</body>
</html>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
